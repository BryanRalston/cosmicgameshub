<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const statsBlock = document.getElementById('stats-block');
  const statTime = document.getElementById('stat-time');
  const statScore = document.getElementById('stat-score');
  const statHi = document.getElementById('stat-hi');
  const statNewHi = document.getElementById('stat-new-hi');
  const btnRowGameover = document.getElementById('btn-row-gameover');
  const btnRestart = document.getElementById('btn-restart');
  const btnShare = document.getElementById('btn-share');
  const startPrompt = document.getElementById('start-prompt');
  const shareToast = document.getElementById('share-toast');
  const btnPlay = document.getElementById('btn-play');
  const btnRowStart = document.getElementById('btn-row-start');
  const btnMute = document.getElementById('btn-mute');
  const btnFire = document.getElementById('btn-fire');
  const btnThrust = document.getElementById('btn-thrust');

  const SHIP_SIZE = 12;
  const ROT_SPD = 4.6;          // rad/s
  const THRUST = 680;           // px/s^2
  const MAX_SPD = 420;          // px/s
  const FIRE_CD = 0.16;
  const BULLET_SPD = 640;
  const BULLET_LIFE = 0.9;
  const INVULN = 2.0;
  const START_LIVES = 3;
  const R_LARGE = 36;
  const R_MED = 20;
  const R_SMALL = 11;

  let muted = false;
  try { muted = localStorage.getItem('ad_mute') === '1'; } catch (e) {}
  let audioCtx = null;
  let shake = 0;
  function initAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function beep(freq, dur, vol) {
    if (muted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }
  function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function syncMute() {
    if (!btnMute) return;
    btnMute.textContent = muted ? 'Muted' : 'Sound on';
    btnMute.setAttribute('aria-pressed', muted ? 'true' : 'false');
  }
  syncMute();
  if (btnMute) btnMute.addEventListener('click', function (e) {
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem('ad_mute', muted ? '1' : '0'); } catch (err) {}
    if (!muted) initAudio();
    syncMute();
  });

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initStars();
  }
  window.addEventListener('resize', resize);

  const STAR_COUNT = 180;
  const stars = [];
  function initStars() {
    stars.length = 0;
    if (!W || !H) return;
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.2,
        a: Math.random() * 0.6 + 0.15,
        twinkleSpeed: 0.3 + Math.random() * 0.8,
        twinklePhase: Math.random() * Math.PI * 2,
      });
    }
  }
  resize();

  let gameStarted = false;
  let gameOver = false;
  let score = 0;
  let points = 0;
  let elapsed = 0;
  let asteroids = [];
  let bullets = [];
  let orbs = [];
  let particles = [];
  let fireCd = 0;
  let wantFire = false;
  let wantThrust = false;
  let thrusting = false;
  let shield = false;
  let shieldTimer = 0;
  let shieldAnim = 0;
  let shieldSpawnTimer = 0;
  const SHIELD_SPAWN_INTERVAL = 30;
  let lastShieldOrb = null;
  let wave = 1;
  let clearPause = 0;
  let orbSpawnTimer = 0;
  const ORB_INTERVAL = 10;
  let flashAlpha = 0;
  let flashColor = '#22D3EE';
  let lives = START_LIVES;
  let invuln = 0;
  let ship = { x: 0, y: 0 };
  let shipAngle = 0;
  let shipVx = 0, shipVy = 0;
  let aimX = 0, aimY = 0;
  let pointerAim = false;
  let pointerAimAge = 0;

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    keys[e.key] = true;
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      wantFire = true;
    }
  });
  window.addEventListener('keyup', e => {
    keys[e.code] = false;
    keys[e.key] = false;
    if (e.code === 'Space' || e.key === ' ') wantFire = false;
  });

  canvas.addEventListener('pointermove', e => {
    aimX = e.clientX;
    aimY = e.clientY;
    pointerAim = true;
    pointerAimAge = 0;
  });
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    aimX = e.clientX;
    aimY = e.clientY;
    pointerAim = true;
    pointerAimAge = 0;
    if (e.pointerType === 'mouse') wantFire = true;
    else wantThrust = true;
    e.preventDefault();
  });
  window.addEventListener('pointerup', () => {
    wantFire = false;
    wantThrust = false;
  });

  function holdBtn(el, on, off) {
    if (!el) return;
    const down = function (e) { e.preventDefault(); e.stopPropagation(); on(); };
    const up = function (e) { e.preventDefault(); off(); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('pointercancel', up);
  }
  holdBtn(btnFire, () => { wantFire = true; tryFire(); }, () => { wantFire = false; });
  holdBtn(btnThrust, () => { wantThrust = true; }, () => { wantThrust = false; });

  function getHiScore() {
    try { return parseInt(localStorage.getItem('ad_hi') || '0', 10); } catch (e) { return 0; }
  }
  function setHiScore(v) {
    try { localStorage.setItem('ad_hi', String(v)); } catch (e) {}
  }

  function heading() { return shipAngle - Math.PI / 2; }

  function wrap(o) {
    if (o.x < 0) o.x += W;
    else if (o.x >= W) o.x -= W;
    if (o.y < 0) o.y += H;
    else if (o.y >= H) o.y -= H;
  }

  function makeAsteroidShape(r, sides) {
    const pts = [];
    for (let i = 0; i < sides; i++) {
      const a = (i / sides) * Math.PI * 2;
      const jitter = r * (0.7 + Math.random() * 0.35);
      pts.push({ x: Math.cos(a) * jitter, y: Math.sin(a) * jitter });
    }
    return pts;
  }

  function rockSpeed(r) {
    const waveMul = 1 + (wave - 1) * 0.08;
    if (r >= 30) return (50 + Math.random() * 40) * waveMul;
    if (r >= 16) return (80 + Math.random() * 50) * waveMul;
    return (120 + Math.random() * 70) * waveMul;
  }

  function spawnAsteroid(r, x, y, inheritAng) {
    let px = x, py = y;
    if (px == null) {
      let tries = 0;
      do {
        px = Math.random() * W;
        py = Math.random() * H;
        tries++;
      } while (tries < 40 && Math.hypot(px - ship.x, py - ship.y) < 200 + r);
    }
    const ang = inheritAng != null ? inheritAng : Math.random() * Math.PI * 2;
    const spd = rockSpeed(r);
    const sides = r >= 30 ? 9 : r >= 16 ? 7 : 6;
    asteroids.push({
      x: px, y: py,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      r,
      angle: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 1.8,
      shape: makeAsteroidShape(r, sides + Math.floor(Math.random() * 3)),
      hue: 30 + Math.floor(Math.random() * 30),
      lightness: 28 + Math.floor(Math.random() * 18),
    });
  }

  function spawnWave(n) {
    for (let i = 0; i < n; i++) spawnAsteroid(R_LARGE);
  }

  function spawnOrb() {
    const margin = 80;
    orbs.push({
      x: margin + Math.random() * (W - margin * 2),
      y: margin + Math.random() * (H - margin * 2),
      r: 6,
      phase: Math.random() * Math.PI * 2,
    });
  }

  function spawnShieldOrb() {
    const margin = 80;
    lastShieldOrb = {
      x: margin + Math.random() * (W - margin * 2),
      y: margin + Math.random() * (H - margin * 2),
      r: 8,
      phase: Math.random() * Math.PI * 2,
    };
  }

  function burst(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.5 + Math.random() * 0.8);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 1,
        decay: 1.4 + Math.random() * 1.2,
        color,
        r: 1.5 + Math.random() * 2,
      });
    }
  }

  function resetShip() {
    ship.x = W / 2;
    ship.y = H / 2;
    shipVx = 0;
    shipVy = 0;
    shipAngle = 0;
    invuln = INVULN;
    bullets = [];
  }

  function init() {
    gameStarted = true;
    gameOver = false;
    score = 0;
    points = 0;
    elapsed = 0;
    asteroids = [];
    bullets = [];
    orbs = [];
    particles = [];
    fireCd = 0;
    wantFire = false;
    wantThrust = false;
    thrusting = false;
    lastShieldOrb = null;
    shield = false;
    shieldTimer = 0;
    shieldAnim = 0;
    shieldSpawnTimer = SHIELD_SPAWN_INTERVAL;
    wave = 1;
    clearPause = 0;
    orbSpawnTimer = ORB_INTERVAL;
    flashAlpha = 0;
    lives = START_LIVES;
    pointerAim = false;
    pointerAimAge = 1;
    resetShip();
    spawnWave(4);

    if (btnRowStart) btnRowStart.style.display = 'none';
    overlay.classList.add('hidden');
    initAudio();
    beep(520, 0.12, 0.08);
    haptic(8);
  }

  function showGameOver() {
    gameOver = true;
    const time = Math.floor(elapsed);
    const hi = getHiScore();
    const isNew = score > hi;
    if (isNew) setHiScore(score);

    statTime.textContent = time + 's';
    statScore.textContent = score;
    statHi.textContent = 'Best: ' + (isNew ? score : hi);
    statNewHi.style.display = isNew ? 'block' : 'none';
    statsBlock.style.display = 'flex';
    btnRowGameover.style.display = 'flex';
    if (btnRowStart) btnRowStart.style.display = 'none';
    startPrompt.style.display = 'none';
    beep(140, 0.35, 0.1);
    haptic(40);
    shake = 12;
    overlay.classList.remove('hidden');
  }

  function doShare() {
    const time = Math.floor(elapsed);
    const text = `☄️ Asteroid Dodge — Survived ${time}s · Score: ${score}\ncosmicgameshub.com/games/asteroid-dodge`;
    navigator.clipboard.writeText(text).then(() => {
      shareToast.classList.add('show');
      setTimeout(() => shareToast.classList.remove('show'), 2200);
    }).catch(() => {
      shareToast.textContent = 'Copy manually: ' + text.split('\n')[0];
      shareToast.classList.add('show');
      setTimeout(() => shareToast.classList.remove('show'), 3500);
    });
  }

  btnRestart.addEventListener('click', e => { e.stopPropagation(); init(); });
  btnShare.addEventListener('click', e => { e.stopPropagation(); doShare(); });
  if (btnPlay) btnPlay.addEventListener('click', e => { e.stopPropagation(); init(); });
  overlay.addEventListener('click', (e) => {
    if (e.target && e.target.closest && e.target.closest('button')) return;
    if (!gameStarted) init();
  });
  overlay.addEventListener('touchstart', e => {
    if (e.target && e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    if (!gameStarted) init();
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    if ((e.code === 'Space' || e.key === 'Enter') && !gameStarted) { e.preventDefault(); init(); }
    if ((e.code === 'Space' || e.key === 'Enter') && gameOver) { e.preventDefault(); init(); }
    if ((e.key === 'm' || e.key === 'M') && btnMute) btnMute.click();
  });
  (function showStartHi() {
    const hi = getHiScore();
    if (hi > 0) {
      statHi.textContent = 'Best: ' + hi;
      statsBlock.style.display = 'flex';
      statTime.textContent = '—';
      statScore.textContent = '—';
    }
  })();

  function tryFire() {
    if (!gameStarted || gameOver || fireCd > 0) return;
    fireCd = FIRE_CD;
    const a = heading();
    const nose = SHIP_SIZE + 6;
    bullets.push({
      x: ship.x + Math.cos(a) * nose,
      y: ship.y + Math.sin(a) * nose,
      vx: Math.cos(a) * BULLET_SPD + shipVx * 0.25,
      vy: Math.sin(a) * BULLET_SPD + shipVy * 0.25,
      life: BULLET_LIFE,
    });
    beep(880, 0.04, 0.045);
    haptic(6);
  }

  function splitAsteroid(a, i) {
    const pts = a.r >= 30 ? 100 : a.r >= 16 ? 50 : 20;
    points += pts;
    burst(a.x, a.y, '#E8C840', 12, 220);
    beep(180 + (36 - Math.min(a.r, 36)) * 8, 0.07, 0.055);
    haptic(10);
    shake = Math.max(shake, 3);
    if (a.r >= 30) {
      spawnAsteroid(R_MED, a.x, a.y, Math.random() * Math.PI * 2);
      spawnAsteroid(R_MED, a.x, a.y, Math.random() * Math.PI * 2);
    } else if (a.r >= 16) {
      spawnAsteroid(R_SMALL, a.x, a.y, Math.random() * Math.PI * 2);
      spawnAsteroid(R_SMALL, a.x, a.y, Math.random() * Math.PI * 2);
    }
    asteroids.splice(i, 1);
  }

  function hitShip() {
    if (invuln > 0) return;
    if (shield) {
      shield = false;
      shieldTimer = 0;
      flashAlpha = 0.8;
      flashColor = '#22D3EE';
      burst(ship.x, ship.y, '#22D3EE', 18, 280);
      beep(440, 0.12, 0.07);
      haptic(12);
      shake = 6;
      invuln = 0.8;
      return;
    }
    burst(ship.x, ship.y, '#FF6B6B', 28, 320);
    flashAlpha = 1;
    flashColor = '#FF3030';
    beep(110, 0.28, 0.1);
    haptic(30);
    shake = 10;
    lives--;
    if (lives <= 0) {
      showGameOver();
      return;
    }
    resetShip();
  }

  function turning() {
    let t = 0;
    if (keys['ArrowLeft'] || keys['KeyA'] || keys['a'] || keys['A']) t -= 1;
    if (keys['ArrowRight'] || keys['KeyD'] || keys['d'] || keys['D']) t += 1;
    return t;
  }

  function update(dt) {
    if (!gameStarted || gameOver) return;

    elapsed += dt;
    shieldAnim += dt * 3;
    invuln = Math.max(0, invuln - dt);
    fireCd = Math.max(0, fireCd - dt);
    if (wantFire || keys[' '] || keys['Space'] || keys['z'] || keys['Z'] || keys['KeyZ']) tryFire();

    score = points + Math.floor(elapsed * 5);

    if (asteroids.length === 0) {
      clearPause += dt;
      if (clearPause > 0.8) {
        clearPause = 0;
        wave++;
        spawnWave(3 + wave);
      }
    } else {
      clearPause = 0;
    }

    shieldSpawnTimer -= dt;
    if (shieldSpawnTimer <= 0 && !lastShieldOrb && !shield) {
      shieldSpawnTimer = SHIELD_SPAWN_INTERVAL;
      spawnShieldOrb();
    }
    orbSpawnTimer -= dt;
    if (orbSpawnTimer <= 0) {
      orbSpawnTimer = ORB_INTERVAL + Math.random() * 6;
      spawnOrb();
    }

    pointerAimAge += dt;
    if (pointerAimAge > 0.35) pointerAim = false;

    const turn = turning();
    if (pointerAim) {
      shipAngle = Math.atan2(aimY - ship.y, aimX - ship.x) + Math.PI / 2;
    } else if (turn) {
      shipAngle += turn * ROT_SPD * dt;
    }

    const thrustOn = wantThrust
      || keys['ArrowUp'] || keys['KeyW'] || keys['w'] || keys['W'];
    const reverse = keys['ArrowDown'] || keys['KeyS'] || keys['s'] || keys['S'];
    thrusting = !!(thrustOn || reverse);
    const h = heading();
    if (thrustOn) {
      shipVx += Math.cos(h) * THRUST * dt;
      shipVy += Math.sin(h) * THRUST * dt;
    } else if (reverse) {
      shipVx -= Math.cos(h) * THRUST * 0.45 * dt;
      shipVy -= Math.sin(h) * THRUST * 0.45 * dt;
    }
    const spd = Math.hypot(shipVx, shipVy);
    if (spd > MAX_SPD) {
      shipVx *= MAX_SPD / spd;
      shipVy *= MAX_SPD / spd;
    }
    ship.x += shipVx * dt;
    ship.y += shipVy * dt;
    wrap(ship);

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) {
        bullets.splice(i, 1);
        continue;
      }
      let hit = false;
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        if (dx * dx + dy * dy < (a.r * 0.92) * (a.r * 0.92)) {
          splitAsteroid(a, j);
          bullets.splice(i, 1);
          hit = true;
          break;
        }
      }
      if (hit) continue;
    }

    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      a.x += a.vx * dt;
      a.y += a.vy * dt;
      a.angle += a.rotSpeed * dt;
      wrap(a);
      const dx = ship.x - a.x;
      const dy = ship.y - a.y;
      const dist = Math.hypot(dx, dy);
      if (dist < a.r * 0.72 + SHIP_SIZE * 0.7) {
        hitShip();
        if (gameOver) return;
      }
    }

    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      o.phase += dt * 3;
      if (Math.hypot(ship.x - o.x, ship.y - o.y) < o.r + SHIP_SIZE) {
        points += 100;
        flashAlpha = 0.5;
        flashColor = '#E8C840';
        burst(o.x, o.y, '#E8C840', 14, 240);
        beep(880, 0.08, 0.06);
        haptic(8);
        orbs.splice(i, 1);
      }
    }

    if (lastShieldOrb) {
      lastShieldOrb.phase += dt * 2;
      if (Math.hypot(ship.x - lastShieldOrb.x, ship.y - lastShieldOrb.y) < lastShieldOrb.r + SHIP_SIZE) {
        shield = true;
        shieldTimer = 12;
        flashAlpha = 0.6;
        flashColor = '#22D3EE';
        burst(lastShieldOrb.x, lastShieldOrb.y, '#22D3EE', 16, 240);
        lastShieldOrb = null;
      }
    }
    if (shield) {
      shieldTimer -= dt;
      if (shieldTimer <= 0) { shield = false; shieldTimer = 0; }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(0.08, dt);
      p.vy *= Math.pow(0.08, dt);
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (flashAlpha > 0) flashAlpha *= Math.pow(0.08, dt);
    if (flashAlpha < 0.01) flashAlpha = 0;
  }

  function drawStars() {
    for (const s of stars) {
      const tw = Math.sin(s.twinklePhase) * 0.3 + 0.7;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,210,230,${s.a * tw})`;
      ctx.fill();
      s.twinklePhase += s.twinkleSpeed * 0.016;
    }
  }

  function drawShip(x, y, angle, hasShield) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    if (thrusting) {
      const eg = ctx.createRadialGradient(0, SHIP_SIZE * 0.7, 0, 0, SHIP_SIZE * 0.7, 18);
      eg.addColorStop(0, 'rgba(251,191,36,0.7)');
      eg.addColorStop(0.4, 'rgba(34,211,238,0.35)');
      eg.addColorStop(1, 'rgba(34,211,238,0)');
      ctx.fillStyle = eg;
      ctx.fillRect(-14, 0, 28, 26);
      ctx.beginPath();
      ctx.moveTo(-3.5, SHIP_SIZE * 0.5);
      ctx.lineTo(0, SHIP_SIZE * 1.35);
      ctx.lineTo(3.5, SHIP_SIZE * 0.5);
      ctx.closePath();
      ctx.fillStyle = '#FDE68A';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.moveTo(0, -SHIP_SIZE);
    ctx.lineTo(-SHIP_SIZE * 0.65, SHIP_SIZE * 0.7);
    ctx.lineTo(-SHIP_SIZE * 0.25, SHIP_SIZE * 0.35);
    ctx.lineTo(0, SHIP_SIZE * 0.5);
    ctx.lineTo(SHIP_SIZE * 0.25, SHIP_SIZE * 0.35);
    ctx.lineTo(SHIP_SIZE * 0.65, SHIP_SIZE * 0.7);
    ctx.closePath();

    const sg = ctx.createLinearGradient(0, -SHIP_SIZE, 0, SHIP_SIZE);
    sg.addColorStop(0, '#A5F3FC');
    sg.addColorStop(0.5, '#22D3EE');
    sg.addColorStop(1, '#0E7490');
    ctx.fillStyle = sg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(165,243,252,0.6)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    if (hasShield) {
      const pulse = 0.55 + Math.sin(shieldAnim) * 0.15;
      const shieldR = SHIP_SIZE * 2.0;
      const shg = ctx.createRadialGradient(0, 0, shieldR * 0.5, 0, 0, shieldR * 1.5);
      shg.addColorStop(0, `rgba(34,211,238,${pulse * 0.35})`);
      shg.addColorStop(0.6, `rgba(34,211,238,${pulse * 0.1})`);
      shg.addColorStop(1, 'rgba(34,211,238,0)');
      ctx.fillStyle = shg;
      ctx.fillRect(-shieldR * 2, -shieldR * 2, shieldR * 4, shieldR * 4);
      ctx.beginPath();
      ctx.arc(0, 0, shieldR, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(34,211,238,${pulse * 0.8})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.angle);
    ctx.beginPath();
    ctx.moveTo(a.shape[0].x, a.shape[0].y);
    for (let i = 1; i < a.shape.length; i++) ctx.lineTo(a.shape[i].x, a.shape[i].y);
    ctx.closePath();
    ctx.fillStyle = `hsl(${a.hue}, 20%, ${a.lightness}%)`;
    ctx.fill();
    ctx.strokeStyle = `hsl(${a.hue}, 25%, ${a.lightness + 18}%)`;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-a.r * 0.2, -a.r * 0.1);
    ctx.lineTo(a.r * 0.15, a.r * 0.3);
    ctx.strokeStyle = `hsl(${a.hue}, 15%, ${a.lightness - 10}%)`;
    ctx.lineWidth = 0.7;
    ctx.stroke();
    ctx.restore();
  }

  function drawOrb(o) {
    const pulse = 0.8 + Math.sin(o.phase) * 0.2;
    const outerR = o.r * 2.8 * pulse;
    ctx.save();
    const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, outerR);
    g.addColorStop(0, 'rgba(252,211,77,0.8)');
    g.addColorStop(0.35, 'rgba(234,179,8,0.35)');
    g.addColorStop(1, 'rgba(234,179,8,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(o.x, o.y, outerR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = '#FDE68A';
    ctx.fill();
    ctx.restore();
  }

  function drawShieldOrb(o) {
    const pulse = 0.8 + Math.sin(o.phase) * 0.2;
    const outerR = o.r * 2.5 * pulse;
    ctx.save();
    const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, outerR);
    g.addColorStop(0, 'rgba(34,211,238,0.75)');
    g.addColorStop(0.4, 'rgba(34,211,238,0.25)');
    g.addColorStop(1, 'rgba(34,211,238,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(o.x, o.y, outerR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = '#A5F3FC';
    ctx.fill();
    ctx.font = '8px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.textAlign = 'center';
    ctx.fillText('SHD', o.x, o.y + o.r * 2.8);
    ctx.restore();
  }

  function drawHUD() {
    ctx.save();
    ctx.font = '13px "JetBrains Mono","Fira Code",monospace';
    ctx.fillStyle = 'rgba(200,204,208,0.55)';
    ctx.textAlign = 'left';
    ctx.fillText(Math.floor(elapsed) + 's', 20, 72);
    ctx.fillText(score, 20, 90);

    ctx.textAlign = 'right';
    const hiNow = getHiScore();
    if (hiNow > 0) {
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(34,211,238,0.45)';
      ctx.fillText('best ' + Math.max(hiNow, score), W - 20, 72);
    }

    ctx.textAlign = 'left';
    for (let i = 0; i < lives; i++) {
      ctx.save();
      ctx.translate(22 + i * 16, 112);
      ctx.rotate(0);
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.lineTo(-4.2, 5);
      ctx.lineTo(4.2, 5);
      ctx.closePath();
      ctx.fillStyle = '#22D3EE';
      ctx.fill();
      ctx.restore();
    }

    ctx.textAlign = 'center';
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(200,204,208,0.22)';
    ctx.fillText('WAVE ' + wave + '  ·  A/D turn  ·  W thrust  ·  SPACE fire', W / 2, H - 16);

    if (shield) {
      ctx.textAlign = 'left';
      ctx.fillStyle = `rgba(34,211,238,${0.4 + Math.sin(shieldAnim) * 0.2})`;
      ctx.fillText('SHIELD ' + Math.ceil(shieldTimer) + 's', 20, H - 16);
    }
    ctx.restore();
  }

  function draw() {
    if (shake > 0.2) {
      ctx.save();
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.86;
    } else {
      shake = 0;
    }
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, W, H);
    drawStars();

    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * Math.max(p.life, 0), 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(p.life, 0) * 0.9;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.strokeStyle = '#FDE68A';
    ctx.shadowColor = '#22D3EE';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    for (const b of bullets) {
      const sp = Math.hypot(b.vx, b.vy) || 1;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - (b.vx / sp) * 14, b.y - (b.vy / sp) * 14);
      ctx.stroke();
    }
    ctx.restore();

    for (const a of asteroids) drawAsteroid(a);
    for (const o of orbs) drawOrb(o);
    if (lastShieldOrb) drawShieldOrb(lastShieldOrb);

    if (gameStarted && !gameOver) {
      const blink = invuln > 0 && Math.floor(invuln * 10) % 2 === 0;
      if (!blink) drawShip(ship.x, ship.y, shipAngle, shield);
    }

    if (flashAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = flashAlpha * 0.35;
      ctx.fillStyle = flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    if (gameStarted && !gameOver) drawHUD();
    if (shake) ctx.restore();
  }

  let lastTS = 0;
  function loop(ts) {
    const dt = Math.min((ts - lastTS) / 1000, 0.05) || 0.016;
    lastTS = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);
  drawStars();
  requestAnimationFrame(loop);

  window.__adDebug = function () {
    return {
      gameStarted, gameOver, nBullets: bullets.length, points,
      shipX: ship.x, shipY: ship.y, shipVx, shipVy, shipAngle,
      heading: heading(), nRocks: asteroids.length, score, elapsed,
      fireCd, wantFire, lives, invuln, wave, thrusting,
      overlayHidden: overlay.classList.contains('hidden'),
      rocks: asteroids.map(a => ({ x: a.x, y: a.y, r: a.r }))
    };
  };
  window.__adTest = {
    stopShip() { shipVx = 0; shipVy = 0; },
    face(a) { shipAngle = a; pointerAim = false; },
    clearRocks() { asteroids = []; },
    placeRock(x, y, r, vx, vy) {
      spawnAsteroid(r || R_LARGE, x, y, 0);
      const a = asteroids[asteroids.length - 1];
      a.vx = vx || 0;
      a.vy = vy || 0;
    }
  };
})();
</script>
<script src="/global.js" defer></script>
</body>
