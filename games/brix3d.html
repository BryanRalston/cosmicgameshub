  <script>
    setTimeout(function start() {
      if (!document.body) { setTimeout(start, 0); return; }
      var nodes = document.querySelectorAll('link[data-brix]');
      var i = 0;
      function boot() {
        var s = document.createElement('script');
        s.src = '/games/brix3d/brix-shell.js';
        s.onload = function () {
          setTimeout(function () {
            var m = document.createElement('script');
            m.src = '/games/brix3d/brix-mount.js';
            document.body.appendChild(m);
          }, 0);
        };
        document.body.appendChild(s);
      }
      // Preloads download together. Each sheet is parsed and laid out on its
      // own turn. Applying every sheet in the first paint was the long task.
      function step() {
        if (i >= nodes.length) { boot(); return; }
        var preload = nodes[i++];
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = preload.getAttribute('href');
        function next() {
          void document.body.offsetHeight;
          setTimeout(step, 0);
        }
        link.onload = next;
        link.onerror = next;
        document.head.appendChild(link);
      }
      setTimeout(step, 0);
    }, 0);
  </script>
