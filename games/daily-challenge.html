  <meta property="og:url" content="https://cosmicgameshub.com/games/daily-challenge"/>
  <style>
    .pk-wrap { max-width: 560px; margin: 0 auto; padding: 0 1rem 3rem; }
    .pk-hero { text-align:center; padding: 1.5rem 0 1rem; }
    .pk-hero img { width:100%; height:140px; object-fit:cover; border-radius:14px; border:1px solid var(--border); margin-bottom:1rem; }
    .pk-clue { background: var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:1.25rem; margin-bottom:1rem; }
    .pk-k { font-size:.68rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:.35rem; }
    .pk-v { font-size:1.15rem; font-weight:800; color:#fff; font-family:'Outfit',sans-serif; margin-bottom:.85rem; }
    .pk-v:last-child { margin-bottom:0; }
    .pk-choices { display:grid; gap:.65rem; }
    .pk-choice { min-height:48px; text-align:left; padding:.85rem 1rem; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,.03); color:#fff; font-weight:700; font-family:inherit; cursor:pointer; }
    .pk-choice:hover { border-color:var(--accent); }
    .pk-choice.is-right { border-color:#00e676; background:rgba(0,230,118,.1); }
    .pk-choice.is-wrong { border-color:#ff4757; background:rgba(255,71,87,.1); }
    .pk-choice:disabled { cursor:default; }
    .pk-result { display:none; text-align:center; margin-top:1.25rem; padding:1.25rem; border:1px solid var(--border); border-radius:16px; background:rgba(0,0,0,.35); }
    .pk-result.show { display:block; }
    .pk-share { font-family: ui-monospace, monospace; font-size:.82rem; color:var(--text-mid); background:var(--bg-surface); border:1px solid var(--border); border-radius:10px; padding:.75rem; white-space:pre-wrap; margin:1rem 0; }
  </style>
</head>
<body>
<nav class="nav" role="navigation" aria-label="Main navigation">
  <div class="container">
    <div class="nav__inner">
      <a href="/" class="nav__logo" aria-label="CosmicGamesHub home">
        <span class="nav__logo-icon">🎮</span>
        <span class="nav__logo-text">Cosmic<span>Games</span>Hub</span>
      </a>
      <ul class="nav__links" id="navLinks">
        <li><a href="/pros">Pros</a></li>
        <li><a href="/games">Games</a></li>
        <li><a href="/games/daily" class="active">Daily</a></li>
        <li><a href="/guides">Guides</a></li>

        <li><a href="/tools/gaming-fps-calculator" class="nav__cta btn">Tools</a></li>
      </ul>
      <button class="nav__hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<main>
  <div class="pk-wrap">
    <div class="pk-hero">
      <img src="/images/game-dailychallenge-v2.jpg" alt="" width="1280" height="720"/>
      <div class="section__eyebrow">Daily · One UTC puzzle</div>
      <h1 style="margin:.4rem 0 .25rem;">Pro Kit Daily</h1>
      <p style="color:var(--text-mid);margin:0;">Guess the pro from a public kit in the August 2026 database. Not a lab. Not a census.</p>
      <p style="color:var(--accent);font-weight:700;margin:.65rem 0 0;" id="pkStreak">Streak 0</p>
    </div>

    <div class="pk-clue" id="pkClue">Loading today's kit…</div>
    <div class="pk-choices" id="pkChoices"></div>
    <div class="pk-result" id="pkResult">
      <h2 id="pkTitle"></h2>
      <p id="pkMsg" style="color:var(--text-mid);"></p>
      <p><a id="pkProLink" href="/pros">Open the pro page →</a></p>
      <div class="pk-share" id="pkShare"></div>
      <button class="btn btn--primary" type="button" id="pkCopy">Copy share</button>
      <div class="cg-daily-dock" data-slug="daily-challenge"></div>
    </div>
  </div>
</main>

<script src="/games/daily-kit.js" defer></script>
<script src="/global.js" defer></script>
<script>
(function () {
  var iso = new Date().toISOString().slice(0, 10);
  var STREAK_KEY = 'cgx-dc-streak';
  var LAST_KEY = 'cgx-dc-last';
  var HIST_KEY = 'cgx-dc-history';

  function safeJSON(k) {
    try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; }
  }
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var x = a[i]; a[i] = a[j]; a[j] = x;
    }
    return a;
  }

  function renderStreak() {
    document.getElementById('pkStreak').textContent = 'Streak ' + (parseInt(localStorage.getItem(STREAK_KEY), 10) || 0);
  }

  function finish(ok, target) {
    var last = localStorage.getItem(LAST_KEY);
    if (last !== iso) {
      var y = new Date(); y.setUTCDate(y.getUTCDate() - 1);
      var yiso = y.toISOString().slice(0, 10);
      var streak = parseInt(localStorage.getItem(STREAK_KEY), 10) || 0;
      localStorage.setItem(STREAK_KEY, String(last === yiso ? streak + 1 : 1));
      localStorage.setItem(LAST_KEY, iso);
      var hist = safeJSON(HIST_KEY) || [];
      hist.push({ date: iso, ok: !!ok, id: target.id });
      localStorage.setItem(HIST_KEY, JSON.stringify(hist.slice(-60)));
    }
    renderStreak();
    document.getElementById('pkTitle').textContent = ok ? 'Correct' : 'Not today';
    document.getElementById('pkMsg').textContent = target.name + ' · ' + (target.team || 'Free Agent') + ' · ' + (target.game || '');
    document.getElementById('pkProLink').href = '/pros/' + target.id;
    var share = 'Pro Kit Daily ' + iso + '\n' + (ok ? 'got it' : 'missed') + ' — ' + target.name + '\ncosmicgameshub.com/games/daily-challenge';
    document.getElementById('pkShare').textContent = share;
    document.getElementById('pkResult').classList.add('show');
    if (window.CGDaily) window.CGDaily.mountAll();
  }

  fetch('/data/pros.json').then(function (r) { return r.json(); }).then(function (pros) {
    var pool = (pros || []).filter(function (p) { return p && p.mouse && p.name && p.id; });
    var day = Math.floor(Date.now() / 86400000);
    var rnd = mulberry(day * 9973);
    var target = pool[Math.floor(rnd() * pool.length)];
    var others = shuffle(pool.filter(function (p) { return p.id !== target.id; }), rnd).slice(0, 3);
    var choices = shuffle(others.concat([target]), rnd);

    document.getElementById('pkClue').innerHTML =
      '<div class="pk-k">Mouse</div><div class="pk-v">' + target.mouse + '</div>' +
      (target.dpi ? '<div class="pk-k">DPI</div><div class="pk-v">' + target.dpi + (target.sensitivity != null ? ' × ' + target.sensitivity : '') + '</div>' : '') +
      '<div class="pk-k">Game</div><div class="pk-v">' + String(target.game || '').toUpperCase() + '</div>' +
      (target.monitor ? '<div class="pk-k">Monitor</div><div class="pk-v">' + target.monitor + '</div>' : '');

    var box = document.getElementById('pkChoices');
    var already = localStorage.getItem(LAST_KEY) === iso;
    choices.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'pk-choice';
      b.type = 'button';
      b.textContent = p.name + (p.team ? ' · ' + p.team : '');
      if (already) {
        b.disabled = true;
        if (p.id === target.id) b.classList.add('is-right');
      } else {
        b.addEventListener('click', function () {
          var ok = p.id === target.id;
          box.querySelectorAll('button').forEach(function (x) {
            x.disabled = true;
            var pid = x.textContent.split(' · ')[0];
            if (pid === target.name) x.classList.add('is-right');
          });
          if (!ok) b.classList.add('is-wrong');
          finish(ok, target);
        });
      }
      box.appendChild(b);
    });
    if (already) {
      var recs = safeJSON(HIST_KEY) || [];
      var rec = recs.filter(function (h) { return h && h.date === iso; }).pop();
      finish(rec ? !!rec.ok : true, target);
      document.getElementById('pkTitle').textContent = 'Already played today';
    }
  }).catch(function () {
    document.getElementById('pkClue').textContent = 'Could not load the pro database. Open /pros and try again.';
  });

  document.getElementById('pkCopy').addEventListener('click', function () {
    var t = document.getElementById('pkShare').textContent;
    if (window.CGDaily) window.CGDaily.copyText(t);
    else if (navigator.clipboard) navigator.clipboard.writeText(t);
    this.textContent = 'Copied';
  });
  renderStreak();
})();
</script>
</body>
</html>
